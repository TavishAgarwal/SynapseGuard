# SynapseGuard Model Configuration
# Read by single GPU session (run_full_gpu_session.py) & sidecar

primary_model:
  name: "google/gemma-2-2b"
  quantization: "int8" # bitsandbytes int8 (VRAM requirement for RTX 3050 6GB)
  sae_release: "gemma-scope-2b-pt-res"
  sae_id: "layer_12/width_16k/canonical"
  target_layers: [11, 12, 13, 14]
  extraction_mode: "last_token"

cross_val_model:
  name: "gpt2"
  quantization: "fp16"
  sae_release: "sae-lens-gpt2-small"
  sae_id: "blocks.6.hook_resid_pre"
  target_layers: [5, 6, 7, 8]
  extraction_mode: "last_token"
